server:
  port: 8082

spring:
  application:
    name: candidate-service

  datasource:
    url: jdbc:postgresql://localhost:5432/ats_candidate_dbs
    username: dieunt
    password:
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: CandidateHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    # ============================================================
    # JPA / HIBERNATE
    # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false